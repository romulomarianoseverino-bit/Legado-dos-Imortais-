name: Build Android APK (Legado dos Imortais)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Compilar APK Debug Instalavel
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Bun (usar bun.lock)
        uses: oven-sh/setup-bun@v2

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias com o lockfile existente
        run: bun install --frozen-lockfile

      - name: Compilar aplicacao web (dist/)
        run: npm run build

      - name: Preparar e sincronizar plataforma Android com Capacitor
        run: npx cap sync android

      - name: Garantir permissao de execucao do Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK de testes (assembleDebug)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verificar se o APK foi gerado
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK como artefato para download
        uses: actions/upload-artifact@v4
        with:
          name: legado-dos-imortais-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
